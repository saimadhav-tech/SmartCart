{% extends "base.html" %}
{% block title %}Store Owner Sign Up{% endblock %}
{% block content %}
    <h1>Store Owner Sign Up</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Owner username" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="text" name="store_name" placeholder="Your store name" required>
        <button type="submit" class="btn-primary">Sign Up</button>
    </form>

    <p>Already an owner? <a href="{{ url_for('owner_login') }}">Login</a></p>
{% endblock %}
